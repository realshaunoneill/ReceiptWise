<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReceiptWise Clipper</title>
  <!-- Critical CSS for instant render -->
  <style>
    body { margin: 0; padding: 0; width: 380px; min-height: 520px; }
    .container { opacity: 0; transition: opacity 0.1s; }
    .container.ready { opacity: 1; }
    .hidden { display: none !important; }
  </style>
  <!-- Use system fonts for instant loading -->
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container" id="container">
    <!-- Header with gradient accent -->
    <header class="header">
      <div class="header-content">
        <div class="logo-wrapper">
          <img src="../icons/icon128.png" width="28" height="28" alt="">
        </div>
        <div class="header-text">
          <h1>ReceiptWise</h1>
          <span class="header-subtitle">Clipper</span>
        </div>
      </div>
    </header>

    <!-- Setup View -->
    <div id="setup-view" class="view">
      <div class="card">
        <div class="card-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <h2>Connect your account</h2>
        <p class="description">Sign in to ReceiptWise in a new tab and connect with one click.</p>
        <button id="connect-btn" class="btn btn-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
            <polyline points="10 17 15 12 10 7"></polyline>
            <line x1="15" y1="12" x2="3" y2="12"></line>
          </svg>
          Connect to ReceiptWise
        </button>
        <p id="setup-note" class="note hidden" role="status"></p>
        <button type="button" id="show-key-form" class="link-button">Use an API key instead</button>
        <div id="key-form" class="hidden">
        <div class="form-group">
          <label for="api-key">API Key</label>
          <div class="input-wrapper">
            <input type="password" id="api-key" placeholder="rw_xxxxxxxxxxxxxxxx">
            <button type="button" id="toggle-visibility" class="input-icon-btn" title="Show/hide key">
              <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="eye-off-icon hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>
        
        <button id="save-key" class="btn btn-secondary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
            <polyline points="10 17 15 12 10 7"></polyline>
            <line x1="15" y1="12" x2="3" y2="12"></line>
          </svg>
          Use this key
        </button>
        
        <a href="https://www.receiptwise.io/settings?tab=integrations" target="_blank" class="help-link" id="settings-link">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
          </svg>
          Create a key in Settings → Integrations
        </a>
        </div>
      </div>
    </div>

    <!-- Main View -->
    <div id="main-view" class="view hidden">
      <div class="status-badge connected">
        <span class="status-dot"></span>
        <span id="account-line">Connected</span>
      </div>
      <p id="premium-note" class="note note-warning hidden">
        Your Premium has ended, so clips won't upload.
        <a href="https://www.receiptwise.io/upgrade" target="_blank" id="upgrade-link">See Premium</a>
      </p>
      
      <div class="capture-section">
        <button id="capture-btn" class="btn btn-capture">
          <div class="capture-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
              <circle cx="12" cy="13" r="4"></circle>
            </svg>
          </div>
          <span class="capture-text">Clip a receipt or bill</span>
          <span class="capture-subtext">Click and drag over it on the page</span>
        </button>
        
        <div class="shortcut-hint">
          <span>Shortcut:</span>
          <div class="kbd-group" id="shortcut-keys"></div>
        </div>
      </div>

      <!-- No upload status here: the popup closes when a capture starts, so progress and the result
           are shown in the page and as a notification instead. -->
      <p id="capture-note" class="note hidden" role="status"></p>

      <div class="footer">
        <button id="disconnect-btn" class="btn btn-ghost">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          Disconnect
        </button>
      </div>
    </div>
  </div>

  <script src="../config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
